<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="个人简历与项目作品集">
  <title>个人履历</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" id="brand-name" href="#top">个人履历</a>
    <nav aria-label="页面导航"><a href="#about">简介</a><a href="#experience">经历</a><a href="#projects">项目</a><a href="#contact">联系</a></nav>
  </header>
  <main id="top">
    <section class="hero" aria-labelledby="name">
      <p class="eyebrow">个人履历 · 项目作品</p>
      <h1 id="name">个人履历</h1>
      <p id="identity" class="identity"></p>
      <p id="intro" class="intro"></p>
      <div class="hero-actions"><a class="button primary" href="assets/resume/public-resume.pdf" download>下载 PDF 简历</a><a class="button" href="assets/resume/public-resume.docx" download>下载 Word 简历</a></div>
    </section>
    <section id="about" class="section two-column">
      <div><p class="eyebrow">教育背景</p><h2>专业积累</h2><div id="education"></div></div>
      <aside class="data-note"><p class="eyebrow">学业数据说明</p><div id="academic"></div></aside>
    </section>
    <section class="section"><p class="eyebrow">个人优势</p><h2>能力与方法</h2><p id="strengths" class="body-copy"></p><div id="skills" class="chips"></div></section>
    <section id="experience" class="section"><p class="eyebrow">实践经历</p><h2>持续投入的现场</h2><div id="experience-list" class="timeline"></div></section>
    <section id="projects" class="section"><p class="eyebrow">项目与成果</p><h2>从分析到行动</h2><div id="project-list" class="cards"></div></section>
    <section class="section honors"><p class="eyebrow">荣誉奖项</p><h2>阶段性成果</h2><ul id="honor-list" class="honor-list"></ul></section>
    <section class="section gallery-section"><p class="eyebrow">活动记录</p><h2>公开精选</h2><div id="gallery" class="gallery"></div></section>
    <section id="contact" class="contact"><p class="eyebrow">联系</p><h2>期待交流</h2><p>欢迎就数据分析、创新实践与项目协作交流。</p><div id="contact-links" class="contact-links"></div><small id="updated"></small></section>
  </main>
  <footer>© <span id="year"></span> <span id="footer-name"></span></footer>
  <script src="app.js"></script>
</body>
</html>
